<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BIENESTAR App - Ecosistema Integral</title>
  <!-- Google Fonts, Lucide Icons & Supabase JS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg-cream: #FAF8EE;
      --green-organic: #2C7A7B;
      --turquoise: #33BCA9;
      --mint: #E0F7F4;
      --dark-teal: #123838;
      --call-bg: #0B2222;
      --red-alert: #E53E3E;
      --gray-muted: #718096;
      --white: #FFFFFF;
      --shadow-sm: 0 2px 8px rgba(18, 56, 56, 0.06);
      --shadow-md: 0 4px 16px rgba(18, 56, 56, 0.12);
      --shadow-lg: 0 8px 30px rgba(0, 0, 0, 0.2);
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-full: 9999px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #121212;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: var(--dark-teal);
    }

    .app-frame {
      width: 100%;
      max-width: 430px;
      height: 100vh;
      max-height: 932px;
      background-color: var(--bg-cream);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(0,0,0,0.5);
    }

    @media (min-width: 440px) {
      .app-frame {
        height: 880px;
        border-radius: 36px;
        border: 8px solid #222;
      }
    }

    /* Splash Screen */
    .splash-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: var(--bg-cream);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 200;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    .splash-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-logo-wrap {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-md);
      margin-bottom: 20px;
      border: 3.5px solid var(--turquoise);
      animation: pulseLogo 2s infinite ease-in-out;
      overflow: hidden;
    }

    .splash-logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    @keyframes pulseLogo {
      0% { transform: scale(0.96); box-shadow: 0 0 0 0 rgba(51, 188, 169, 0.4); }
      50% { transform: scale(1.04); box-shadow: 0 0 0 16px rgba(51, 188, 169, 0); }
      100% { transform: scale(0.96); box-shadow: 0 0 0 0 rgba(51, 188, 169, 0); }
    }

    .splash-title {
      font-size: 22px;
      font-weight: 800;
      color: var(--dark-teal);
    }

    .splash-sub {
      font-size: 12px;
      color: var(--green-organic);
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    .loading-bar-wrap {
      width: 140px;
      height: 4px;
      background: var(--mint);
      border-radius: 10px;
      overflow: hidden;
    }

    .loading-bar-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, var(--green-organic), var(--turquoise));
      animation: loadingFill 1.8s ease-in-out infinite;
    }

    @keyframes loadingFill {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .status-bar {
      height: 40px;
      padding: 0 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--dark-teal);
    }

    .app-header {
      padding: 10px 18px;
      background: var(--bg-cream);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(51, 188, 169, 0.12);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .brand-logo { display: flex; align-items: center; gap: 10px; }
    .brand-logo-img { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; border: 2px solid var(--turquoise); }
    .brand-title { font-size: 18px; font-weight: 800; color: var(--dark-teal); }
    .brand-subtitle { font-size: 10px; color: var(--green-organic); font-weight: 600; text-transform: uppercase; }

    .header-actions { display: flex; gap: 8px; position: relative; }
    .icon-btn {
      width: 36px; height: 36px; border-radius: 50%;
      background-color: var(--mint); border: none; color: var(--dark-teal);
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }

    .whatsapp-dropdown-menu {
      display: none; position: absolute; top: 44px; right: 0; width: 220px;
      background: var(--white); border-radius: var(--radius-md); box-shadow: var(--shadow-lg);
      border: 1px solid rgba(51, 188, 169, 0.18); padding: 6px 0; z-index: 150;
    }
    .whatsapp-dropdown-menu.active { display: block; }

    .dropdown-item {
      padding: 10px 16px; font-size: 13px; font-weight: 600; color: var(--dark-teal);
      display: flex; align-items: center; gap: 12px; cursor: pointer;
    }
    .dropdown-divider { height: 1px; background-color: rgba(51, 188, 169, 0.12); margin: 4px 0; }

    .app-content { flex: 1; overflow-y: auto; position: relative; display: flex; flex-direction: column; }
    .tab-page { display: none; flex-direction: column; height: 100%; }
    .tab-page.active { display: flex; }

    /* Regulador Emocional */
    .emotional-slider-section {
      padding: 14px 18px 12px 18px; background: var(--white);
      border-bottom: 1px solid rgba(51, 188, 169, 0.15); display: flex; flex-direction: column; gap: 10px;
    }
    .slider-header { display: flex; justify-content: space-between; align-items: center; }
    .slider-badge {
      font-size: 11px; font-weight: 800; color: var(--white); background: var(--turquoise);
      padding: 3px 12px; border-radius: var(--radius-full);
    }
    .neuro-slider-bar {
      -webkit-appearance: none; appearance: none; width: 100%; height: 14px; border-radius: 12px;
      background: linear-gradient(90deg, #FF5A5F 0%, #FF9F1C 20%, #FFBF00 40%, #2EC4B6 60%, #3A86FF 80%, #8338EC 100%);
    }

    /* Buscador Limpio */
    .search-filter-section { padding: 10px 16px 8px 16px; }
    .search-box {
      background: var(--white); border-radius: var(--radius-full); padding: 10px 18px;
      display: flex; align-items: center; gap: 10px; border: 1px solid rgba(51, 188, 169, 0.2);
    }
    .search-input { border: none; outline: none; background: transparent; width: 100%; font-size: 13.5px; }

    .contacts-list { flex: 1; overflow-y: auto; padding: 6px 16px; display: flex; flex-direction: column; gap: 4px; }
    .contact-item {
      display: flex; align-items: center; justify-content: space-between; padding: 12px;
      background: var(--white); border-radius: var(--radius-md); margin-bottom: 6px; cursor: pointer;
    }

    /* Chat Individual */
    .single-chat-view {
      display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: var(--bg-cream); z-index: 50; flex-direction: column;
    }
    .single-chat-view.active { display: flex; }
    .chat-header-bar { padding: 10px 14px; background: var(--white); display: flex; justify-content: space-between; align-items: center; }
    .messages-area { flex: 1; padding: 12px 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .message-bubble { max-width: 80%; padding: 10px 14px; border-radius: 16px; font-size: 13.5px; }
    .msg-received { background: var(--white); color: var(--dark-teal); }
    .msg-sent { background: var(--green-organic); color: var(--white); align-self: flex-end; }

    .chat-input-bar { padding: 10px 14px; background: var(--white); display: flex; align-items: center; gap: 8px; }
    .chat-input { flex: 1; background: var(--bg-cream); border: none; padding: 10px 16px; border-radius: 24px; }

    /* Bottom Nav */
    .bottom-nav {
      height: 66px; background: var(--white); display: flex; justify-content: space-around;
      align-items: center; border-top: 1px solid rgba(51, 188, 169, 0.15);
    }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; border: none; background: none; color: var(--gray-muted); cursor: pointer; }
    .nav-item.active { color: var(--green-organic); }

    /* Videollamada Modal */
    .video-call-modal {
      display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: var(--call-bg); z-index: 100; flex-direction: column; justify-content: space-between; padding: 48px 24px 36px; color: var(--white);
    }
    .video-call-modal.active { display: flex; }
    .call-video-card { width: 100%; max-width: 320px; height: 220px; background: #1A3C3C; border-radius: 24px; margin: 16px auto; overflow: hidden; }
    .webcam-video-element { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }

    /* Ajustes Vista Completa */
    .settings-full-view {
      display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: var(--bg-cream); z-index: 120; flex-direction: column; overflow-y: auto;
    }
    .settings-full-view.active { display: flex; }
    .settings-top-bar { padding: 12px 16px; background: var(--white); display: flex; justify-content: space-between; align-items: center; }
    .setting-row-item { padding: 14px 20px; display: flex; align-items: center; gap: 16px; background: var(--white); border-bottom: 1px solid var(--bg-cream); cursor: pointer; }
  </style>
</head>
<body>

  <div class="app-frame">
    
    <!-- Splash Screen -->
    <div class="splash-screen" id="splashScreen">
      <div class="splash-logo-wrap">
        <img src="logo_bienestar_png.jpeg" alt="Logo BIENESTAR" onerror="this.src='logo bienestar png.jpeg'">
      </div>
      <div class="splash-title">BIENESTAR</div>
      <div class="splash-sub">Ecosistema Integral</div>
      <div class="loading-bar-wrap"><div class="loading-bar-fill"></div></div>
    </div>

    <!-- Top Status -->
    <div class="status-bar">
      <span>18:57</span>
      <div style="display: flex; gap: 6px;"><i data-lucide="wifi" size="14"></i><i data-lucide="battery" size="16"></i></div>
    </div>

    <!-- Header -->
    <div class="app-header">
      <div class="brand-logo">
        <img src="logo_bienestar_png.jpeg" class="brand-logo-img" alt="Logo" onerror="this.src='logo bienestar png.jpeg'">
        <div>
          <div class="brand-title">BIENESTAR</div>
          <div class="brand-subtitle">WhatsApp • Supabase Connected</div>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" onclick="openVoiceCall()"><i data-lucide="phone" size="18"></i></button>
        <button class="icon-btn" onclick="openVideoCall()"><i data-lucide="video" size="18"></i></button>
        <button class="icon-btn" onclick="toggleWhatsAppMenu(event)"><i data-lucide="more-vertical" size="18"></i></button>

        <div class="whatsapp-dropdown-menu" id="whatsappMenu">
          <div class="dropdown-item" onclick="openFullSettings(); toggleWhatsAppMenu();"><i data-lucide="settings" size="16"></i> Ajustes</div>
        </div>
      </div>
    </div>

    <!-- App Content -->
    <div class="app-content">
      
      <!-- TAB CHATS -->
      <div id="tab-chats" class="tab-page active">
        <div class="emotional-slider-section">
          <div class="slider-header">
            <span style="font-size:12px; font-weight:800; color:var(--green-organic);">Regulador Emocional</span>
            <span class="slider-badge" id="sliderBadge">En Calma</span>
          </div>
          <input type="range" min="1" max="6" value="4" class="neuro-slider-bar" id="neuroSlider" oninput="updateSensorySlider(this.value)" onchange="saveEmocionalReg(this.value)">
        </div>

        <div class="search-filter-section">
          <div class="search-box">
            <i data-lucide="search" size="18" color="#2C7A7B"></i>
            <input type="text" class="search-input" placeholder="Buscar contactos..." onkeyup="filterContacts(this.value)">
          </div>
        </div>

        <div class="contacts-list" id="contactsList">
          <div class="contact-item" onclick="openSingleChat('Asistente BIENESTAR 🌿', 'logo_bienestar_png.jpeg', 'Especialista')">
            <div>
              <div style="font-weight:700;">Asistente BIENESTAR</div>
              <div style="font-size:12px; color:var(--gray-muted);">Sincronizado con Supabase</div>
            </div>
            <span style="font-size:10px; background:var(--turquoise); color:white; padding:2px 6px; border-radius:10px;">1</span>
          </div>
        </div>
      </div>

    </div>

    <!-- Chat Modal -->
    <div class="single-chat-view" id="singleChatView">
      <div class="chat-header-bar">
        <button class="icon-btn" style="background:none;" onclick="closeSingleChat()"><i data-lucide="arrow-left" size="20"></i></button>
        <span id="activeChatName" style="font-weight:700;">Chat</span>
        <button class="icon-btn" onclick="openVideoCall()"><i data-lucide="video" size="18"></i></button>
      </div>
      <div class="messages-area" id="messagesArea"></div>
      <div class="chat-input-bar">
        <input type="text" id="chatInput" class="chat-input" placeholder="Escribe un mensaje..." onkeypress="handleKeyPress(event)">
        <button class="icon-btn" style="background:var(--turquoise); color:white;" onclick="sendMessage()"><i data-lucide="send" size="18"></i></button>
      </div>
    </div>

    <!-- Videollamada Modal -->
    <div class="video-call-modal" id="videoCallModal">
      <div class="call-video-card">
        <video id="webcamVideo" class="webcam-video-element" autoplay playsinline muted></video>
      </div>
      <button class="icon-btn" style="background:var(--red-alert); color:white; width:60px; height:60px; margin:0 auto;" onclick="closeVideoCall()"><i data-lucide="phone-off" size="24"></i></button>
    </div>

    <!-- Bottom Nav -->
    <div class="bottom-nav">
      <button class="nav-item active"><i data-lucide="message-circle" size="20"></i><span>Chats</span></button>
      <button class="nav-item"><i data-lucide="heart-pulse" size="20"></i><span>Wellness</span></button>
      <button class="nav-item"><i data-lucide="shopping-bag" size="20"></i><span>Tienda</span></button>
      <button class="nav-item"><i data-lucide="moon" size="20"></i><span>Morfeo</span></button>
    </div>

  </div>

  <script>
    lucide.createIcons();

    // 1. Configuración de Cliente Supabase
    const SUPABASE_URL = 'https://rggdizeajuiglorxyaye.supabase.co';
    const SUPABASE_ANON_KEY = 'TU_SUPABASE_ANON_KEY_AQUI'; // Reemplazar con tu anon key de Supabase

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    window.addEventListener('load', () => {
      setTimeout(() => {
        document.getElementById('splashScreen').classList.add('hidden');
      }, 1500);
      loadLatestEmocional();
    });

    // Guardar Regulador Emocional en Supabase
    async function saveEmocionalReg(val) {
      const sensoryLabels = { 1:'Crisis', 2:'Ansiedad', 3:'Alerta', 4:'En Calma', 5:'Enfoque', 6:'Vínculo' };
      try {
        await supabase.from('registros_emocionales').insert([
          { sensory_level: parseInt(val), status_label: sensoryLabels[val] }
        ]);
      } catch (err) {
        console.log('Modo offline / Supabase sincronizando:', err);
      }
    }

    async function loadLatestEmocional() {
      try {
        const { data } = await supabase.from('registros_emocionales').select('*').order('created_at', { ascending: false }).limit(1);
        if (data && data.length > 0) {
          document.getElementById('neuroSlider').value = data.sensory_level;
          updateSensorySlider(data.sensory_level);
        }
      } catch (e) {}
    }

    function updateSensorySlider(val) {
      const labels = { 1:'Crisis', 2:'Ansiedad', 3:'Alerta', 4:'En Calma', 5:'Enfoque', 6:'Vínculo' };
      document.getElementById('sliderBadge').innerText = labels[val];
    }

    function toggleWhatsAppMenu(e) {
      if (e) e.stopPropagation();
      document.getElementById('whatsappMenu').classList.toggle('active');
    }

    function openSingleChat(name) {
      document.getElementById('activeChatName').innerText = name;
      document.getElementById('singleChatView').classList.add('active');
    }

    function closeSingleChat() {
      document.getElementById('singleChatView').classList.remove('active');
    }

    async function sendMessage() {
      const input = document.getElementById('chatInput');
      if (!input.value.trim()) return;
      const text = input.value.trim();
      input.value = '';

      const area = document.getElementById('messagesArea');
      const msg = document.createElement('div');
      msg.className = 'message-bubble msg-sent';
      msg.innerText = text;
      area.appendChild(msg);

      try {
        await supabase.from('messages').insert([{ content: text }]);
      } catch (e) {}
    }

    function handleKeyPress(e) { if (e.key === 'Enter') sendMessage(); }

    let localStream = null;
    async function openVideoCall() {
      document.getElementById('videoCallModal').classList.add('active');
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        document.getElementById('webcamVideo').srcObject = localStream;
      } catch (e) {}
    }

    function closeVideoCall() {
      document.getElementById('videoCallModal').classList.remove('active');
      if (localStream) localStream.getTracks().forEach(t => t.stop());
    }

    function openVoiceCall() { openVideoCall(); }
    function openFullSettings() { alert('Ajustes sincronizados con Supabase'); }
    function filterContacts(q) {}
  </script>
</body>
</html>
